name: windows-build

on: [push, pull_request]

env:
  SVF_Z3: 1
  LLVM_SDK_TAG: "llvm_22.1.4"
  Z3_VERSION: "4.15.4"

jobs:
  windows-build:
    name: windows-build (${{ matrix.compiler }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        compiler: [msvc, mingw]
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (MinGW only)
        if: matrix.compiler == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-llvm
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-z3

      - name: Install dependencies (MSVC only)
        if: matrix.compiler == 'msvc'
        shell: powershell
        run: |
          # 1. Install LLVM toolchain and Ninja via Chocolatey
          choco install llvm ninja -y
          
          # 2. Download and extract LLVM development SDK
          curl.exe -L "https://github.com/c3lang/llvm-for-c3/releases/download/${{ env.LLVM_SDK_TAG }}/llvm-windows-amd64.tar.gz" -o llvm-sdk.tar.gz
          New-Item -ItemType Directory -Force -Path C:\llvm-sdk | Out-Null
          tar -xf llvm-sdk.tar.gz -C C:\llvm-sdk
          
          # 3. Copy Clang compiler binaries from Chocolatey LLVM to the SDK bin folder
          Copy-Item -Path "C:\Program Files\LLVM\bin\clang.exe" -Destination "C:\llvm-sdk\bin\" -Force
          Copy-Item -Path "C:\Program Files\LLVM\bin\clang++.exe" -Destination "C:\llvm-sdk\bin\" -Force
          Copy-Item -Path "C:\Program Files\LLVM\bin\clang-cl.exe" -Destination "C:\llvm-sdk\bin\" -Force
          
          # 3.5. Strip hardcoded absolute MSVC diaguids.lib path from LLVMExports.cmake
          $exportsFile = "C:\llvm-sdk\lib\cmake\llvm\LLVMExports.cmake"
          if (Test-Path $exportsFile) {
              $content = Get-Content $exportsFile -Raw
              $newContent = $content -replace '[a-zA-Z]:/[^";]+?/DIA SDK/lib/amd64/diaguids\.lib;', ""
              Set-Content $exportsFile $newContent -NoNewline
          }
          
          # 3.8. Download and extract Z3 for MSVC
          curl.exe -L "https://github.com/Z3Prover/z3/releases/download/z3-${{ env.Z3_VERSION }}/z3-${{ env.Z3_VERSION }}-x64-win.zip" -o z3.zip
          Expand-Archive -Path z3.zip -DestinationPath C:\z3-temp
          $z3Folder = Get-ChildItem C:\z3-temp -Directory | Select-Object -First 1
          Move-Item -Path $z3Folder.FullName -Destination C:\z3
          
          # 4. Export environment variables
          Add-Content -Path $env:GITHUB_PATH -Value "C:\llvm-sdk\bin" -Encoding UTF8
          Add-Content -Path $env:GITHUB_PATH -Value "C:\z3\bin" -Encoding UTF8
          Add-Content -Path $env:GITHUB_ENV -Value "LLVM_DIR=C:\llvm-sdk" -Encoding UTF8
          Add-Content -Path $env:GITHUB_ENV -Value "Z3_DIR=C:\z3" -Encoding UTF8

      - name: Add MSVC to PATH
        if: matrix.compiler == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Clone Test-Suite
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          git clone --depth 1 "https://github.com/SVF-tools/Test-Suite.git" Test-Suite
          if (-not (Test-Path "Test-Suite\CMakeLists.txt")) {
            Write-Host "Upstream Test-Suite clone failed (due to Windows path colons). Falling back to dg1474/Test-Suite (windows-port-tests)..." -ForegroundColor Yellow
            Remove-Item -Recurse -Force Test-Suite -ErrorAction SilentlyContinue
            git clone --depth 1 -b windows-port-tests "https://github.com/dg1474/Test-Suite.git" Test-Suite
          }
          if (-not (Test-Path "Test-Suite\CMakeLists.txt")) {
            throw "Test-Suite checkout failed."
          }

      - name: Build SVF (MSVC)
        if: matrix.compiler == 'msvc'
        shell: powershell
        run: |
          cmake -B Release-build -S . `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DLLVM_DIR="$env:LLVM_DIR" `
            -DZ3_DIR="$env:Z3_DIR" `
            -DSVF_Z3=ON `
            -DSVF_WARN_AS_ERROR=OFF
          cmake --build Release-build -j

      - name: Build SVF (MinGW)
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        run: |
          cmake -B Release-build -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DSVF_Z3=ON \
            -DSVF_WARN_AS_ERROR=OFF
          cmake --build Release-build -j

      - name: Run CTests (MSVC)
        if: matrix.compiler == 'msvc'
        shell: powershell
        working-directory: ${{ github.workspace }}/Release-build
        run: |
          $env:PATH = "${{ github.workspace }}\Release-build\bin;${{ github.workspace }}\Release-build\lib;C:\z3\bin;$env:PATH"
          ctest --output-on-failure

      - name: Run CTests (MinGW)
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        working-directory: ${{ github.workspace }}/Release-build
        run: |
          export PATH="${{ github.workspace }}/Release-build/bin:${{ github.workspace }}/Release-build/lib:$PATH"
          ctest --output-on-failure
