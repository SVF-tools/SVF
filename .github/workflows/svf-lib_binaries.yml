name: svf-publish

# Triggers the publish workflow only on master
on:
  push:
    branches: [ master ]

permissions:
  contents: write
  id-token: write 

# Customize the env variable
env:
  SVF_CTIR: 1
  SVF_Z3: 1
  SVF_DIR: $GITHUB_WORKSPACE

jobs:
  publish:
    if: github.repository == 'SVF-tools/SVF'
    runs-on: ${{ matrix.os }}
    environment: npm-publish
    env:
      XCODE_VERSION: 'latest-stable'  # Define Xcode version here to reuse it
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm, windows-2022]

    steps:
      # checkout the repo
      - uses: actions/checkout@v4

      # setup the environment
      - name: mac-setup
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: mac-setup-workaround
        if: runner.os == 'macOS'
        run: |
          XCODE_PATH=$(dirname $(dirname $(xcode-select -p)))
          sudo ln -sfn "$XCODE_PATH" /Applications/Xcode.app
          brew install astyle

      # Ubuntu settings
      - name: ubuntu-setup
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ nodejs doxygen graphviz libncurses5-dev libtinfo6 libzstd-dev astyle

      # Windows settings (MSVC)
      - name: windows-setup
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install llvm ninja -y
          curl.exe -L "https://github.com/c3lang/llvm-for-c3/releases/download/llvm_22.1.4/llvm-windows-amd64.tar.gz" -o llvm-sdk.tar.gz
          New-Item -ItemType Directory -Force -Path C:\llvm-sdk | Out-Null
          tar -xf llvm-sdk.tar.gz -C C:\llvm-sdk
          
          Copy-Item -Path "C:\Program Files\LLVM\bin\clang.exe" -Destination "C:\llvm-sdk\bin\" -Force
          Copy-Item -Path "C:\Program Files\LLVM\bin\clang++.exe" -Destination "C:\llvm-sdk\bin\" -Force
          Copy-Item -Path "C:\Program Files\LLVM\bin\clang-cl.exe" -Destination "C:\llvm-sdk\bin\" -Force
          
          $exportsFile = "C:\llvm-sdk\lib\cmake\llvm\LLVMExports.cmake"
          if (Test-Path $exportsFile) {
              $content = Get-Content $exportsFile -Raw
              $newContent = $content -replace '[a-zA-Z]:/[^";]+?/DIA SDK/lib/amd64/diaguids\.lib;', ""
              Set-Content $exportsFile $newContent -NoNewline
          }
          
          curl.exe -L "https://github.com/Z3Prover/z3/releases/download/z3-4.15.4/z3-4.15.4-x64-win.zip" -o z3.zip
          Expand-Archive -Path z3.zip -DestinationPath C:\z3-temp
          $z3Folder = Get-ChildItem C:\z3-temp -Directory | Select-Object -First 1
          Move-Item -Path $z3Folder.FullName -Destination C:\z3
          
          Add-Content -Path $env:GITHUB_PATH -Value "C:\llvm-sdk\bin" -Encoding UTF8
          Add-Content -Path $env:GITHUB_PATH -Value "C:\z3\bin" -Encoding UTF8
          Add-Content -Path $env:GITHUB_ENV -Value "LLVM_DIR=C:\llvm-sdk" -Encoding UTF8
          Add-Content -Path $env:GITHUB_ENV -Value "Z3_DIR=C:\z3" -Encoding UTF8

      - name: Add MSVC to PATH
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: env-setup
        if: github.event_name == 'push' && github.repository == 'SVF-tools/SVF'
        shell: bash
        run: |
          echo $RUNNER_OS
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      # code-format and build-svf (Unix)
      - name: code-format-and-build-svf (Unix)
        if: runner.os != 'Windows'
        run: |
          cd $GITHUB_WORKSPACE
          echo $(pwd)
          git pull
          astyle --style=allman -n -r "*.h" "*.cpp"
          git clone "https://github.com/SVF-tools/Test-Suite.git";
          source ${{github.workspace}}/build.sh dyn_lib

      # build-svf (Windows)
      - name: build-svf (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          cmake -B Release-build -S . `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DLLVM_DIR="$env:LLVM_DIR" `
            -DZ3_DIR="$env:Z3_DIR" `
            -DSVF_Z3=ON `
            -DBUILD_SHARED_LIBS=ON `
            -DSVF_WARN_AS_ERROR=OFF
          cmake --build Release-build -j

      # update formatting code and doxygen
      - name: update-formatting-code-and-doxygen
        if: |
          github.event_name == 'push' &&
          github.repository == 'SVF-tools/SVF' &&
          runner.os == 'Linux' &&
          github.ref == 'refs/heads/master'
        run: |
          if [ "$(uname -m)" == "x86_64" ]; then
            cd $GITHUB_WORKSPACE
            echo $(pwd)
            git status
            git add .
            if [ -n "$(git status -s)" ]; then git commit -m"SVF code formatter"; fi
            git push "https://x-access-token:${{github.token}}@github.com/${{github.repository}}.git" HEAD:master
            cd $GITHUB_WORKSPACE/docs && doxygen doxygen.config
            cd $GITHUB_WORKSPACE  && git clone https://github.com/SVF-tools/SVF-doxygen.git
            cp -r $GITHUB_WORKSPACE/docs/generated-doc/html $GITHUB_WORKSPACE/SVF-doxygen/
            cd $GITHUB_WORKSPACE/SVF-doxygen
            git add .
            if [ -n "$(git status -s)" ]; then git commit -m"update SVF doxygen"       ; fi
            git push https://yuleisui:${{secrets.yulei_git_key}}@github.com/SVF-tools/SVF-doxygen.git   HEAD:master
          fi

      # update performance testing to Test-Suite
      - name: upload-performance-testing-to-Test-Suite
        working-directory: ${{github.workspace}}/Release-build
        if: |
          github.event_name == 'push' &&
          github.repository == 'SVF-tools/SVF' &&
          runner.os == 'Linux' &&
          github.ref == 'refs/heads/master'
        run: |
          if [ "$(uname -m)" == "x86_64" ]; then
            ctest -R diff-perf-cruxbc -VV
            git pull
            cp -r ${{github.workspace}}/Release-build/Testing/Temporary/LastTest.log $GITHUB_WORKSPACE/Test-Suite/diff_tests/perf_history/perf-$(date +'%Y-%m-%dT%H-%M-%S').txt
            cp -r ${{github.workspace}}/Release-build/Testing/Temporary/LastTest.log $GITHUB_WORKSPACE/Test-Suite/diff_tests/perf-latest.txt
            cd $GITHUB_WORKSPACE/Test-Suite/diff_tests
            git add .
            if [ -n "$(git status -s)" ]; then git commit -m"update latest SVF performance data"       ; fi
            git push https://yuleisui:${{secrets.yulei_git_key}}@github.com/SVF-tools/Test-Suite.git   HEAD:master
          fi

      # update-svf-lib binaries to svf-npm for later publishing
      - name: update-svf-lib
        if: |
          github.event_name == 'push' &&
          github.repository == 'SVF-tools/SVF' &&
          github.ref == 'refs/heads/master'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/..
          git clone https://github.com/SVF-tools/SVF-npm.git
          if [ "$RUNNER_OS" == "Linux" ]; then
            osVersion="linux-$(uname -m)"
          elif [ "$RUNNER_OS" == "macOS" ]; then
            osVersion="osx"
          elif [ "$RUNNER_OS" == "Windows" ]; then
            osVersion="windows-x86_64"
          fi
          echo "osVersion=${osVersion}"
          cd ./SVF-npm
          git fetch origin
          git rebase origin/master

          git rm -rf SVF-${osVersion}/* || true
          rm -rf SVF-${osVersion}/*
          mkdir -p SVF-${osVersion}/
          svfNpmPath=$(pwd)
          cd $GITHUB_WORKSPACE/Release-build
          cmake --install . --prefix ${svfNpmPath}/SVF-${osVersion}/
          cd -
          git add .
          if [ -n "$(git status -s)" ]; then git commit -m"Update svflib for ${osVersion}" ; fi
          npm version patch
          git push https://yuleisui:${{secrets.yulei_git_key}}@github.com/SVF-tools/SVF-npm.git   HEAD:master
          cd $GITHUB_WORKSPACE
