name: svf-build

# Triggers the workflow on push or pull request events
on: [push, pull_request]

# Customize the env variable
env:
  SVF_CTIR: 1
  SVF_Z3: 1
  SVF_DIR: ${{ github.workspace }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      XCODE_VERSION: "latest-stable"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: [ubuntu-latest]
            sanitizer: address
    steps:
      # checkout the repo
      - uses: actions/checkout@v4
      # setup the environment
      - name: mac-setup
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: mac-setup-workaround
        if: runner.os == 'macOS'
        run: |
          XCODE_PATH=$(dirname $(dirname $(xcode-select -p)))
          sudo ln -sfn "$XCODE_PATH" /Applications/Xcode.app
          brew install astyle

      - name: ubuntu-setup
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ nodejs doxygen graphviz lcov libncurses5-dev libtinfo6 libzstd-dev astyle wget
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22

      # build-svf
      - name: build-svf
        run: |
          cd $GITHUB_WORKSPACE
          echo $(pwd)
          if [ "${{matrix.sanitizer}}" != "" ]; then export SVF_SANITIZER="${{matrix.sanitizer}}"; fi
          if [ "$RUNNER_OS" == "Linux" ] && [ "${{matrix.sanitizer}}" == "" ]; then export SVF_COVERAGE=1; fi
          export LLVM_DIR=/usr/lib/llvm-22
          git clone "https://github.com/SVF-tools/Test-Suite.git";
          source ${{github.workspace}}/build.sh

      - name: ctest objtype inference
        working-directory: ${{github.workspace}}/Release-build
        run:
          ctest -R objtype -VV

      - name: ctest wpa
        working-directory: ${{github.workspace}}/Release-build
        run:
          ctest -R wpa_tests -VV

      - name: ctest dvf
        working-directory: ${{github.workspace}}/Release-build
        run:
          ctest -R dvf_tests -VV

      - name: ctest mta
        working-directory: ${{github.workspace}}/Release-build
        run:
          ctest -R mta_tests -VV

      - name: ctest andersen differential analysis
        working-directory: ${{github.workspace}}/Release-build
        run:
          ctest -R diff_tests-ander -VV

      - name: ctest flow-sensitive differential analysis
        working-directory: ${{github.workspace}}/Release-build
        run:
          ctest -R diff_tests-fs -VV

      - name: ctest Andersen file-write-read
        working-directory: ${{github.workspace}}/Release-build
        run:
          ctest -R diff_tests-wr-ander -VV

      - name: ctest mem_leak
        working-directory: ${{github.workspace}}/Release-build
        run:
          ctest -R mem_leak -VV

      - name: ctest double_free
        working-directory: ${{github.workspace}}/Release-build
        run:
          ctest -R double_free -VV

      - name: ctest ae_symabs
        working-directory: ${{github.workspace}}/Release-build
        run:
          ctest -R symabs -VV

      - name: ctest ae_assert
        working-directory: ${{github.workspace}}/Release-build
        run:
          ctest -R ae_assert_test -VV

      - name: ctest ae_overflow
        working-directory: ${{github.workspace}}/Release-build
        run:
          ctest -R ae_overflow_test -VV

      - name: ctest ae_null_deref
        working-directory: ${{github.workspace}}/Release-build
        run:
          ctest -R ae_nullptr_deref_tests -VV

      - name: ctest ae_recursion
        working-directory: ${{github.workspace}}/Release-build
        run:
          ctest -R ae_recursion_tests -VV

      - name: ctest ae_no_main
        working-directory: ${{github.workspace}}/Release-build
        run:
          ctest -R ae_no_main -VV

      - name: ctest ae_semi_sparse
        working-directory: ${{github.workspace}}/Release-build
        run:
          ctest -R semi_sparse -VV

      - name: ctest ae_full_sparse
        working-directory: ${{github.workspace}}/Release-build
        run:
          ctest -R ae_full_sparse -VV

      - name: ctest cfl_tests
        working-directory: ${{github.workspace}}/Release-build
        run:
          ctest -R cfl_tests -VV

      - name: ctest performance tests on big cruxbc with file system diff tests
        working-directory: ${{github.workspace}}/Release-build
        if: runner.os == 'Linux' && matrix.sanitizer != 'address'
        run:
          ctest -R diff-perf-cruxbc-big -VV

      - name: ctest performance tests on small cruxbc with file system diff tests
        working-directory: ${{github.workspace}}/Release-build
        if: runner.os == 'Linux'
        run:
          ctest -R diff-perf-cruxbc-small -VV

      - name: create-coverage-report-and-remove-system-files
        working-directory: ${{github.workspace}}/Release-build
        if: runner.os == 'Linux' && matrix.sanitizer == ''
        run: |
          lcov --capture --directory ./ --output-file coverage.info
          lcov --remove coverage.info '/usr/*' --output-file coverage.info --ignore-errors unused
          lcov --remove coverage.info '${{github.workspace}}/z3.obj/*' --output-file coverage.info --ignore-errors unused
          lcov --remove coverage.info '${{github.workspace}}/llvm-*.obj/*' --output-file coverage.info --ignore-errors unused
          lcov --remove coverage.info '${{github.workspace}}/svf/include/FastCluster/*' --output-file coverage.info --ignore-errors unused
          lcov --remove coverage.info '${{github.workspace}}/svf/lib/FastCluster/*' --output-file coverage.info --ignore-errors unused

      - name: upload-coverage
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.info
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  windows-build:
    name: windows-build (${{ matrix.compiler }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [mingw, msvc]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (MSVC only)
        if: matrix.compiler == 'msvc'
        shell: powershell
        run: |
          # 1. Install LLVM toolchain via Chocolatey (provides clang.exe)
          choco install llvm -y
          
          # 2. Download and extract LLVM SDK from c3lang/llvm-for-c3 (provides LLVMConfig.cmake and static libraries) using curl.exe
          curl.exe -L "https://github.com/c3lang/llvm-for-c3/releases/download/llvm_22.1.4/llvm-windows-amd64.tar.gz" -o llvm-sdk.tar.gz
          New-Item -ItemType Directory -Force -Path C:\llvm-sdk | Out-Null
          tar -xf llvm-sdk.tar.gz -C C:\llvm-sdk
          
          # 3. Copy Clang compiler binaries from Chocolatey LLVM to the SDK bin folder
          Copy-Item -Path "C:\Program Files\LLVM\bin\clang.exe" -Destination "C:\llvm-sdk\bin\" -Force
          Copy-Item -Path "C:\Program Files\LLVM\bin\clang++.exe" -Destination "C:\llvm-sdk\bin\" -Force
          Copy-Item -Path "C:\Program Files\LLVM\bin\clang-cl.exe" -Destination "C:\llvm-sdk\bin\" -Force
          
          # 3.5. Locate and patch the hardcoded MSVC diaguids.lib path in the LLVM SDK configuration
          $searchPaths = @(
              "$env:ProgramFiles\Microsoft Visual Studio\2022",
              "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022"
          ) | Where-Object { Test-Path $_ }
          $diaPath = (Get-ChildItem -Path $searchPaths -Filter "diaguids.lib" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "DIA SDK\\lib\\amd64" } | Select-Object -ExpandProperty FullName -First 1)
          if ($diaPath) {
              $diaPath = $diaPath -replace '\\', '/'
              $exportsFile = "C:\llvm-sdk\lib\cmake\llvm\LLVMExports.cmake"
              if (Test-Path $exportsFile) {
                  $content = Get-Content $exportsFile -Raw
                  $oldPath = "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/DIA SDK/lib/amd64/diaguids.lib"
                  $newContent = $content.Replace($oldPath, $diaPath)
                  Set-Content $exportsFile $newContent -NoNewline
              }
          }
          
          # 4. Export environment variables using UTF-8 encoding
          Add-Content -Path $env:GITHUB_PATH -Value "C:\llvm-sdk\bin" -Encoding UTF8
          Add-Content -Path $env:GITHUB_ENV -Value "LLVM_DIR=C:\llvm-sdk" -Encoding UTF8

      - name: Add MSVC to PATH
        if: matrix.compiler == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Clone Test-Suite (Windows compatible branch)
        shell: powershell
        run: |
          git clone -b windows-compat "https://github.com/dg1474/Test-Suite.git" Test-Suite

      - name: Patch Test-Suite for Windows compatibility
        shell: powershell
        run: |
          python patch_test_suite.py

      - name: Build SVF
        shell: powershell
        run: |
          if ("${{ matrix.compiler }}" -eq "msvc") {
            powershell -ExecutionPolicy Bypass -File build.ps1 -BuildType Release -Compiler msvc -LLVMDir "$env:LLVM_DIR"
          } else {
            powershell -ExecutionPolicy Bypass -File build.ps1 -BuildType Release -Compiler mingw
          }

      - name: Run CTests
        shell: powershell
        working-directory: ${{ github.workspace }}/Release-build
        run: |
          . ..\setup.ps1 Release
          ctest --output-on-failure
